<title>Unsinkable Ice Cube Tray</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one vertical 9:16 stage centred on a dark page, transport controls underneath.
   Single committed dark look so the film frame reads the same in any theme. */
:root{
  --bg:#0c111f; --panel:#151c31; --line:#2a3454; --fg:#eef1f8; --muted:#9aa7c7;
  --accent:#ffb347; --ink:#241726; --night:#0f1c3d;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 28px/1.1 var(--display);text-wrap:balance}
.frame{position:relative;width:100%;aspect-ratio:9/16;max-height:80vh;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.5)}
@media(min-width:700px){.frame{width:calc(80vh*9/16);max-width:100%}}
canvas{display:block;width:100%;height:100%}
#big{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;padding:14px 26px;border-radius:999px;border:0;
  background:var(--accent);color:#2a1a05;font:700 17px var(--display);cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#big:focus-visible,.ctl:focus-visible,#seek:focus-visible{outline:3px solid #fff;outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctl{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.ctl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#seek{flex:1 1 100%;order:5;accent-color:var(--accent)}
#time{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}
#cc{min-height:3.2em;margin:0;padding:10px 12px;border-radius:8px;background:var(--panel);color:var(--fg);font-size:15px;text-wrap:pretty}
.note{margin:0;color:var(--muted);font-size:13px;text-wrap:pretty}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Inter:wght@400;600&display=swap">

<main class="wrap">
  <header>
    <p class="eyebrow">Cartoon short &middot; HTML preview &middot; draft 1</p>
    <h1>The Unsinkable Ice Cube Tray</h1>
  </header>
  <div class="frame">
    <canvas id="c" width="540" height="960" aria-label="Animated cartoon short about the Titanic"></canvas>
    <button id="big" type="button">Play with sound</button>
  </div>
  <div class="controls">
    <button class="ctl" id="play" type="button">Play</button>
    <button class="ctl" id="restart" type="button">Restart</button>
    <button class="ctl" id="ccbtn" type="button" aria-pressed="true">Captions</button>
    <button class="ctl" id="snd" type="button" aria-pressed="true">Sound</button>
    <span id="time">0:00 / 1:11</span>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  </div>
  <p id="cc" aria-live="off"></p>
  <p class="note">The narration uses your browser's built-in voice, and the sound effects are synthesized. Captions are only here for the preview and would not be in the video.</p>
</main>

<script>
(() => {
const W = 540, H = 960, TAU = Math.PI * 2, INK = '#241726';
const cv = document.getElementById('c'), c = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * x * (x * (x * 6 - 15) + 10); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = Array.from({ length: 90 }, () => [rnd() * W, rnd() * 600, rnd() * 1.6 + .5, rnd() * TAU]);

/* ---------- drawing helpers ---------- */
function skyGrad(top, bot, y0 = 0, y1 = H) { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(0, y0, W, y1 - y0); }
function stars(t, a = 1) { c.save(); STARS.forEach(([x, y, r, p]) => { c.globalAlpha = a * (.55 + .45 * Math.sin(t * 2 + p)); c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }); c.restore(); }
function sea(y, t, top, bot, alpha = 1, amp = 5) {
  c.save(); c.globalAlpha = alpha; const g = c.createLinearGradient(0, y, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g;
  c.beginPath(); c.moveTo(0, H); c.lineTo(0, y);
  for (let x = 0; x <= W; x += 12) c.lineTo(x, y + Math.sin(x * .03 + t * 1.6) * amp + Math.sin(x * .071 - t * 1.1) * amp * .5);
  c.lineTo(W, H); c.closePath(); c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.globalAlpha = alpha * .9; c.stroke(); c.restore();
}
function ink(w = 3) { c.lineWidth = w; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; }
function rr(x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function poly(pts, fill, lw = 3) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } if (lw) { ink(lw); c.stroke(); } }
function shake(t, t0, amp, dur = .35) { const k = clamp(1 - (t - t0) / dur); if (t < t0 || k <= 0) return [0, 0]; return [Math.sin(t * 90) * amp * k, Math.cos(t * 77) * amp * k]; }

/* ---------- characters: bean heads, stick limbs, plum ink ---------- */
function bean(x, y, h, o = {}) {
  const hh = h / 3.5, lw = Math.max(1.4, h * .012), face = o.face || 'neutral', ph = o.walk;
  c.save(); c.translate(x, y); if (o.flip) c.scale(-1, 1); c.rotate(o.lean || 0); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK; c.lineWidth = lw;
  const hip = -1.4 * hh;
  for (const s of [-1, 1]) {
    const q = ph == null ? 0 : Math.sin(ph + (s > 0 ? 0 : Math.PI));
    const fx = s * hh * .15 + q * hh * .45, fy = ph == null ? 0 : -Math.max(0, Math.cos(ph + (s > 0 ? 0 : Math.PI))) * hh * .15;
    c.lineWidth = lw * 2.2; c.beginPath(); c.moveTo(s * hh * .15, hip); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = INK; c.beginPath(); c.ellipse(fx + hh * .08, fy - hh * .02, hh * .17, hh * .09, 0, 0, TAU); c.fill();
  }
  c.lineWidth = lw; c.fillStyle = o.coat || '#c84b3c';
  c.beginPath(); c.moveTo(-hh * .36, hip); c.quadraticCurveTo(-hh * .5, -1.9 * hh, -hh * .3, -2.45 * hh); c.lineTo(hh * .3, -2.45 * hh); c.quadraticCurveTo(hh * .5, -1.9 * hh, hh * .36, hip); c.closePath(); c.fill(); c.stroke();
  if (o.belt) { c.fillStyle = o.belt; c.fillRect(-hh * .4, hip - hh * .26, hh * .8, hh * .14); }
  const arm = (side, a) => { const sx = side * hh * .32, sy = -2.3 * hh, L = hh * 1.15, ex = sx + side * Math.sin(a) * L, ey = sy + Math.cos(a) * L;
    c.lineWidth = lw * 2; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke(); c.fillStyle = INK; c.beginPath(); c.arc(ex, ey, hh * .1, 0, TAU); c.fill(); };
  const wa = ph == null ? 0 : Math.sin(ph) * .45;
  arm(-1, o.armL ?? (.25 + wa)); arm(1, o.armR ?? (.25 - wa));
  const cy = -2.95 * hh; c.lineWidth = lw * 1.1; c.fillStyle = o.skin || '#f7d9b0';
  c.beginPath(); c.moveTo(0, cy - hh * .5); c.bezierCurveTo(hh * .5, cy - hh * .5, hh * .5, cy + hh * .25, hh * .2, cy + hh * .5);
  c.bezierCurveTo(hh * .05, cy + hh * .55, -hh * .05, cy + hh * .55, -hh * .2, cy + hh * .5); c.bezierCurveTo(-hh * .5, cy + hh * .25, -hh * .5, cy - hh * .5, 0, cy - hh * .5); c.closePath(); c.fill(); c.stroke();
  if (o.hat === 'cap') { c.fillStyle = '#1f3a6e'; c.beginPath(); c.ellipse(0, cy - hh * .4, hh * .46, hh * .24, 0, Math.PI, TAU); c.fill(); c.stroke(); c.fillStyle = '#17274a'; rr(-hh * .5, cy - hh * .42, hh, hh * .1, 3); c.fill(); c.stroke(); c.fillStyle = '#e8c04a'; c.beginPath(); c.arc(0, cy - hh * .55, hh * .06, 0, TAU); c.fill(); }
  if (o.hat === 'hard') { c.fillStyle = '#f2c230'; c.beginPath(); c.ellipse(0, cy - hh * .38, hh * .5, hh * .3, 0, Math.PI, TAU); c.fill(); c.stroke(); rr(-hh * .56, cy - hh * .42, hh * 1.12, hh * .09, 3); c.fill(); c.stroke(); }
  if (o.hat === 'beanie') { c.fillStyle = '#3b6fb0'; c.beginPath(); c.ellipse(0, cy - hh * .34, hh * .5, hh * .34, 0, Math.PI, TAU); c.fill(); c.stroke(); c.fillStyle = '#f0f0f0'; c.beginPath(); c.arc(0, cy - hh * .7, hh * .09, 0, TAU); c.fill(); c.stroke(); }
  const ey = cy - hh * .02, ex = hh * .13;
  c.fillStyle = INK;
  if (o.blink) { c.lineWidth = lw * 1.2; [-1, 1].forEach(s => { c.beginPath(); c.moveTo(s * ex - hh * .05, ey); c.lineTo(s * ex + hh * .05, ey); c.stroke(); }); }
  else [-1, 1].forEach(s => { c.beginPath(); c.arc(s * ex, ey, hh * (face === 'shock' ? .06 : .045), 0, TAU); c.fill(); });
  c.lineWidth = lw * 1.1; const my = cy + hh * .2;
  if (face === 'shout') { c.beginPath(); c.ellipse(0, my, hh * .13, hh * .17, 0, 0, TAU); c.fill(); }
  else if (face === 'shock') { c.beginPath(); c.arc(0, my, hh * .07, 0, TAU); c.stroke(); [-1, 1].forEach(s => { c.beginPath(); c.moveTo(s * ex - hh * .07, ey - hh * .13); c.lineTo(s * ex + hh * .07, ey - hh * .17); c.stroke(); }); }
  else if (face === 'smile') { c.beginPath(); c.arc(0, my - hh * .06, hh * .13, .15, Math.PI - .15); c.stroke(); }
  else if (face === 'sad') { c.beginPath(); c.arc(0, my + hh * .1, hh * .11, Math.PI + .2, TAU - .2); c.stroke(); }
  else { c.beginPath(); c.moveTo(-hh * .1, my); c.lineTo(hh * .1, my); c.stroke(); }
  c.restore();
}

/* ---------- ship (cutaway side view), tray, iceberg, props ---------- */
const HULL = [[-222, -46], [188, -46], [226, -28], [152, 32], [-208, 32], [-224, 6]];
const CX0 = -206, CX1 = 186, NC = 16, CW = (CX1 - CX0) / NC;
function hullPath() { c.beginPath(); HULL.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); }
function ship(o) {
  const { x, y, s = 1, tilt = 0, flip = 1, cut = 0, walls = 0, wallTop = -24, flood = null, deck = true, floodCol = '#3aa0e0' } = o;
  c.save(); c.translate(x, y); c.rotate(tilt); c.scale(s * flip, s); ink(3);
  if (deck) {
    const dk = (x0, y0, w, h, col) => { c.fillStyle = col; c.fillRect(x0, y0, w, h); c.strokeRect(x0, y0, w, h); };
    dk(-190, -62, 330, 16, '#f3eee2'); dk(-150, -76, 240, 14, '#efe8d8'); dk(-110, -88, 150, 12, '#f3eee2');
    c.fillStyle = '#3a4a68'; for (let i = 0; i < 30; i++) c.fillRect(-182 + i * 10.8, -57, 5, 5); for (let i = 0; i < 21; i++) c.fillRect(-142 + i * 10.8, -71, 5, 5);
    [-95, -45, 5, 55].forEach(fx => { c.fillStyle = '#e8a93a'; c.fillRect(fx - 12, -134, 24, 48); c.strokeRect(fx - 12, -134, 24, 48); c.fillStyle = '#151218'; c.fillRect(fx - 12, -134, 24, 10); c.strokeRect(fx - 12, -134, 24, 10); });
    c.beginPath(); c.moveTo(150, -62); c.lineTo(150, -132); c.moveTo(-172, -62); c.lineTo(-172, -112); c.stroke();
  }
  hullPath(); c.fillStyle = '#2a3144'; c.fill();
  c.save(); hullPath(); c.clip(); c.fillStyle = '#b5342c'; c.fillRect(-300, 8, 700, 60); c.fillStyle = '#f3eee2'; c.fillRect(-300, 6, 700, 3);
  if (cut > 0) { c.fillStyle = `rgba(247,240,222,${cut})`; c.fillRect(-300, -46, 700, 90); }
  if (flood) for (let i = 0; i < NC; i++) { const lv = flood[i] || 0; if (lv > 0) { c.fillStyle = floodCol; const hg = lv * 78; c.fillRect(CX0 + i * CW, 32 - hg, CW + .5, hg); } }
  if (walls > 0) { ink(2.4); for (let i = 0; i <= NC && i <= walls; i++) { const wx = CX0 + i * CW; c.beginPath(); c.moveTo(wx, 32); c.lineTo(wx, wallTop); c.stroke(); } }
  c.restore(); hullPath(); ink(3.2); c.stroke(); c.restore();
}
function iceberg(x, y, s, a = 1) {
  c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = a;
  c.fillStyle = 'rgba(170,220,245,.55)'; c.beginPath(); c.moveTo(-95, 0); c.lineTo(-120, 40); c.lineTo(-60, 85); c.lineTo(20, 100); c.lineTo(100, 60); c.lineTo(120, 10); c.lineTo(95, 0); c.closePath(); c.fill();
  poly([[-95, 0], [-70, -40], [-40, -30], [-10, -95], [25, -60], [50, -80], [90, -20], [95, 0]], '#f3fbff', 3);
  poly([[-10, -95], [25, -60], [10, 0], [-25, 0], [-30, -40]], '#bcdcf2', 0); c.beginPath(); c.moveTo(-10, -95); c.lineTo(25, -60); c.lineTo(50, -80); c.lineTo(90, -20); c.lineTo(95, 0); c.lineTo(10, 0); c.closePath(); ink(3); c.stroke(); c.restore();
}
function spark(x, y, t, n = 9) { c.save(); ink(2.5); c.strokeStyle = '#ffd24a'; for (let i = 0; i < n; i++) { const a = i / n * TAU + t * 3, r1 = 6 + (t * 40 % 10), r2 = r1 + 8 + 8 * Math.sin(i + t * 9); c.beginPath(); c.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); c.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); c.stroke(); } c.restore(); }
function smoke(x, y, t) { c.save(); for (let i = 0; i < 6; i++) { const k = (((t * .35 + i / 6) % 1) + 1) % 1; c.globalAlpha = (1 - k) * .55; c.fillStyle = '#e9edf5'; c.beginPath(); c.arc(x - k * 70, y - k * 55, 8 + k * 20, 0, TAU); c.fill(); } c.restore(); }
function stream(x0, y0, x1, y1, a = 1, w = 6) { if (a <= 0) return; c.save(); c.globalAlpha = a; c.strokeStyle = '#3aa0e0'; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2, Math.min(y0, y1) - 26, x1, y1); c.stroke(); c.restore(); }

function tray(o) { // side-on cutaway of an ice cube tray with short walls
  const { x, y, n = 8, cw = 56, tilt = 0, lv = [], pitch = 0 } = o, w = n * cw;
  c.save(); c.translate(x, y); c.rotate(tilt); ink(3);
  for (let i = 0; i < n; i++) {
    const x0 = -w / 2 + i * cw; c.beginPath(); c.moveTo(x0 + 4, -14); c.lineTo(x0 + cw - 4, -14); c.lineTo(x0 + cw - 12, 54); c.lineTo(x0 + 12, 54); c.closePath();
    c.fillStyle = 'rgba(214,242,250,.9)'; c.fill();
    const l = lv[i] || 0; if (l > 0) { c.save(); c.clip(); c.fillStyle = '#3aa0e0'; c.fillRect(x0, 54 - l * 68, cw, l * 68); c.restore(); }
    c.beginPath(); c.moveTo(x0 + 4, -14); c.lineTo(x0 + cw - 4, -14); c.lineTo(x0 + cw - 12, 54); c.lineTo(x0 + 12, 54); c.closePath(); c.stroke();
  }
  c.beginPath(); c.moveTo(-w / 2 - 6, -14); c.lineTo(w / 2 + 6, -14); c.stroke();
  rr(-w / 2 - 6, 52, w + 12, 12, 5); c.fillStyle = '#8fd6e6'; c.fill(); ink(3); c.stroke(); c.restore();
}
function jug(x, y, rot) { c.save(); c.translate(x, y); c.rotate(rot); ink(3); c.fillStyle = '#e5eaf2'; rr(-24, -34, 48, 62, 10); c.fill(); c.stroke(); c.fillStyle = '#3aa0e0'; c.fillRect(-20, -4, 40, 28); c.beginPath(); c.moveTo(24, -26); c.quadraticCurveTo(46, -22, 28, 4); c.stroke(); c.restore(); }
function bell(x, y, ang) { c.save(); c.translate(x, y); c.rotate(ang); ink(3); c.fillStyle = '#e8b93a'; c.beginPath(); c.moveTo(-22, 38); c.quadraticCurveTo(-24, 0, 0, -6); c.quadraticCurveTo(24, 0, 22, 38); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#6b4b12'; c.beginPath(); c.arc(0, 42, 7, 0, TAU); c.fill(); c.beginPath(); c.moveTo(0, -6); c.lineTo(0, -26); c.stroke(); c.restore(); }
function boat(x, y, s = 1, col = '#e07a2e') { c.save(); c.translate(x, y); c.scale(s, s); ink(2.5); c.fillStyle = col; c.beginPath(); c.moveTo(-18, -5); c.quadraticCurveTo(0, 14, 18, -5); c.lineTo(15, -9); c.lineTo(-15, -9); c.closePath(); c.fill(); c.stroke(); c.restore(); }
function checkmark(x, y, s, col = '#3bb46a') { c.save(); c.translate(x, y); c.scale(s, s); c.lineWidth = 9; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.beginPath(); c.moveTo(-14, 0); c.lineTo(-4, 11); c.lineTo(16, -12); c.stroke(); c.restore(); }
function cross(x, y, s, col = '#e0453a') { c.save(); c.translate(x, y); c.scale(s, s); c.lineWidth = 9; c.lineCap = 'round'; c.strokeStyle = col; c.beginPath(); c.moveTo(-13, -13); c.lineTo(13, 13); c.moveTo(13, -13); c.lineTo(-13, 13); c.stroke(); c.restore(); }
function frame(x, y, w, h, col = 'rgba(255,255,255,.08)') { rr(x, y, w, h, 18); c.fillStyle = col; c.fill(); ink(3); c.stroke(); }

/* ---------- scenes ---------- */
const DAY_TOP = '#5e93d9', DAY_BOT = '#b8d0ec', SEA_A = '#2f7fc4', SEA_B = '#164c86';
const topShip = () => { // top-down liner, bow at -y
  poly([[0, -170], [22, -118], [28, -40], [27, 120], [14, 152], [-14, 152], [-27, 120], [-28, -40], [-22, -118]], '#2a3144', 3.4);
  poly([[0, -158], [17, -116], [22, -40], [21, 118], [10, 144], [-10, 144], [-21, 118], [-22, -40], [-17, -116]], '#f3eee2', 2.4);
  [-60, -22, 16, 54].forEach(fy => { c.fillStyle = '#e8a93a'; c.beginPath(); c.ellipse(0, fy, 12, 15, 0, 0, TAU); c.fill(); ink(2.5); c.stroke(); c.fillStyle = '#151218'; c.beginPath(); c.ellipse(0, fy, 7, 9, 0, 0, TAU); c.fill(); });
};
const topBerg = (x, y, r) => { c.save(); c.translate(x, y); poly([[-r, -r * .1], [-r * .6, -r * .8], [r * .1, -r], [r * .85, -r * .5], [r, r * .3], [r * .5, r * .9], [-r * .3, r * .85]], '#f3fbff', 3.2); poly([[r * .1, -r], [r * .85, -r * .5], [r, r * .3], [r * .5, r * .9], [r * .1, r * .1]], '#bcdcf2', 0); c.restore(); };

function sc1(t, d) { // hook: ice cube tray, the liner floating in one cup
  const z = 1 + .12 * (t / d);
  skyGrad('#d9f2fb', '#9fd8ec'); c.save(); c.translate(W / 2, 470); c.scale(z, z); c.translate(-W / 2, -470);
  frame(40, 200, 460, 560, '#8fd6e6'); ink(3.4);
  for (let r = 0; r < 4; r++) for (let q = 0; q < 4; q++) { const cx = 78 + q * 106, cy = 236 + r * 130; rr(cx, cy, 96, 120, 20); c.fillStyle = '#bff0fa'; c.fill(); c.stroke();
    if (r === 1 && q === 2) { c.fillStyle = '#3aa0e0'; rr(cx + 6, cy + 20, 84, 94, 14); c.fill(); c.save(); c.translate(cx + 48, cy + 62 + Math.sin(t * 3) * 2); c.scale(.17, .17); ship({ x: 0, y: 0, tilt: Math.sin(t * 2) * .05 }); c.restore(); } }
  c.restore();
  if (t > d - .35) { c.fillStyle = `rgba(255,255,255,${sstep(d - .35, d - .05, t)})`; c.fillRect(0, 0, W, H); }
}

function say(txt) { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); if (!soundOn || !playing) return; const u = new SpeechSynthesisUtterance(txt); if (voice) u.voice = voice; u.rate = 1.08; u.pitch = .95; speechSynthesis.speak(u); }
function sceneAt(tm) { let i = 0; while (i < SCENES.length - 1 && tm >= SCENES[i + 1].start) i++; return i; }
function render() {
  const k = cv.width / W, i = sceneAt(now), s = SCENES[i], t = now - s.start;
  c.setTransform(k, 0, 0, k, 0, 0); c.clearRect(0, 0, W, H); c.save(); c.beginPath(); c.rect(0, 0, W, H); c.clip(); s.draw(t, s.d);
  if (i > 0 && i !== 9 && t < .18) { c.fillStyle = `rgba(0,0,0,${1 - t / .18})`; c.fillRect(0, 0, W, H); } c.restore();
  if (i !== lastScene) { lastScene = i; ccEl.textContent = ccOn ? s.say : ''; if (playing) say(s.say); }
  const f = n => `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, '0')}`; document.getElementById('time').textContent = `${f(now)} / ${f(TOTAL)}`; seekEl.value = String(Math.round(now / TOTAL * 1000));
}
function tick(ts) { const dt = Math.min(.1, (ts - last) / 1000); last = ts;
  if (playing) { const p = now; now += dt; EVENTS.forEach(([et, nm]) => { if (p < et && now >= et && SFX[nm]) SFX[nm](); }); if (now >= TOTAL) { now = TOTAL - .001; playing = false; ended = true; speechSynthesis.cancel(); sync(); } }
  render(); requestAnimationFrame(tick); }
const playBtn = document.getElementById('play'), big = document.getElementById('big'), seekEl = document.getElementById('seek');
function sync() { playBtn.textContent = playing ? 'Pause' : (ended ? 'Replay' : 'Play'); big.hidden = playing || now > .05; }

playBtn.onclick = () => playing ? pause() : play(); big.onclick = play;
document.getElementById('restart').onclick = () => { now = 0; ended = false; lastScene = -1; play(); };
seekEl.oninput = () => { now = seekEl.value / 1000 * TOTAL; ended = false; lastScene = -1; if ('speechSynthesis' in window) speechSynthesis.cancel(); sync(); };
const ccb = document.getElementById('ccbtn'), sb = document.getElementById('snd');
ccb.onclick = () => { ccOn = !ccOn; ccb.setAttribute('aria-pressed', ccOn); ccEl.textContent = ccOn ? SCENES[sceneAt(now)].say : ''; };
sb.onclick = () => { soundOn = !soundOn; sb.setAttribute('aria-pressed', soundOn); if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel(); else if (playing) say(SCENES[sceneAt(now)].say); };
const q = new URLSearchParams(location.search).get('t'); if (q) { now = parseFloat(q) || 0; big.hidden = true; }
requestAnimationFrame(ts => { last = ts; tick(ts); });
})();
